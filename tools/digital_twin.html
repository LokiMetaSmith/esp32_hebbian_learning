<!DOCTYPE html>
<html>
<head>
    <title>Hebbian Robot 3D Digital Twin</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; color: #fff; font-family: monospace; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 100; }
        #ip-input { background: #333; color: #fff; border: 1px solid #555; padding: 5px; }
        button { background: #444; color: #fff; border: 1px solid #666; padding: 5px; cursor: pointer; }
        button:hover { background: #555; }
    </style>
    <!-- Use r128 instead of unpkg module approach for simple single-file deployment -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="info">
        <h3>ESP32 3D Digital Twin</h3>
        <input type="text" id="ip-input" value="192.168.4.1" placeholder="ESP32 IP Address">
        <button onclick="connect()">Connect</button>
        <div id="status">Disconnected</div>
    </div>
    <script>
        let scene, camera, renderer;
        let base, shoulder, upperArm, elbow, forearm, wrist, hand;
        let fetchInterval = null;
        let espIp = "192.168.4.1";

        function init() {
            scene = new THREE.Scene();
            scene.add(new THREE.GridHelper(20, 20));
            scene.add(new THREE.AxesHelper(5));

            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(15, 15, 15);
            camera.lookAt(0, 5, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Kinematic Chain
            const matBase = new THREE.MeshPhongMaterial({ color: 0x555555 });
            const matArm = new THREE.MeshPhongMaterial({ color: 0x00aaff });
            const matJoint = new THREE.MeshPhongMaterial({ color: 0xffaa00 });

            // Base (Fixed)
            base = new THREE.Group();
            const baseMesh = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 1, 32), matBase);
            baseMesh.position.y = 0.5;
            base.add(baseMesh);
            scene.add(base);

            // Shoulder (Yaw) -> Joint 0
            shoulder = new THREE.Group();
            shoulder.position.y = 1.0;
            const shoulderMesh = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), matJoint);
            shoulder.add(shoulderMesh);
            base.add(shoulder);

            // Upper Arm (Pitch) -> Joint 1
            upperArm = new THREE.Group();
            const upperArmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 4, 16), matArm);
            upperArmMesh.position.y = 2; // half height
            upperArm.add(upperArmMesh);
            shoulder.add(upperArm);

            // Elbow (Pitch) -> Joint 2
            elbow = new THREE.Group();
            elbow.position.y = 4;
            const elbowMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), matJoint);
            elbow.add(elbowMesh);
            upperArm.add(elbow);

            // Forearm
            forearm = new THREE.Group();
            const forearmMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 3, 16), matArm);
            forearmMesh.position.y = 1.5;
            forearm.add(forearmMesh);
            elbow.add(forearm);

            // Wrist (Pitch) -> Joint 3
            wrist = new THREE.Group();
            wrist.position.y = 3;
            const wristMesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), matJoint);
            wrist.add(wristMesh);
            forearm.add(wrist);

            // Hand (Roll/Gripper) -> Joint 4 (mocked as simple box)
            hand = new THREE.Group();
            const handMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 1.5), matBase);
            handMesh.position.y = 0.5;
            hand.add(handMesh);
            wrist.add(hand);

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        async function fetchState() {
            try {
                const res = await fetch(`http://${espIp}/api/stats`);
                if (!res.ok) throw new Error("Network not ok");
                const data = await res.json();

                if (data.joints && data.joints.length >= 4) {
                    // Map normalized joints [-1, 1] to radians.
                    // Adjust scales as needed based on actual robot kinematics.
                    const j0 = data.joints[0] * Math.PI; // Yaw
                    const j1 = data.joints[1] * (Math.PI / 2); // Pitch
                    const j2 = data.joints[2] * (Math.PI / 2); // Pitch
                    const j3 = data.joints[3] * (Math.PI / 2); // Pitch

                    shoulder.rotation.y = j0;
                    upperArm.rotation.x = j1;
                    elbow.rotation.x = j2;
                    wrist.rotation.x = j3;

                    if (data.joints.length >= 5) {
                        hand.rotation.z = data.joints[4] * Math.PI; // Gripper Roll
                    }
                }
                document.getElementById('status').innerText = `Connected: ${new Date().toLocaleTimeString()}`;
                document.getElementById('status').style.color = "#00ff00";
            } catch (err) {
                document.getElementById('status').innerText = `Error: ${err.message}`;
                document.getElementById('status').style.color = "#ff0000";
            }
        }

        function connect() {
            espIp = document.getElementById('ip-input').value;
            if (fetchInterval) clearInterval(fetchInterval);
            fetchInterval = setInterval(fetchState, 100); // 10Hz updates
            document.getElementById('status').innerText = "Connecting...";
            document.getElementById('status').style.color = "#ffff00";
        }

        window.onload = init;
    </script>
</body>
</html>
